<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TechPilot – Skizzenmodul Test</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f6f7;color:#171717}
header{padding:14px 16px;background:#fff;border-bottom:1px solid #ddd;display:flex;align-items:center;gap:10px}
header strong{margin-right:auto;font-size:18px}
.toolbar{padding:10px;background:#fff;border-bottom:1px solid #ddd;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button{border:0;border-radius:10px;padding:10px 13px;background:#eee;font-size:15px;cursor:pointer}
button.active{outline:3px solid #bbb}
.done{background:#171717;color:#fff}
canvas{display:block;width:calc(100vw - 20px);height:calc(100vh - 125px);margin:10px;border:1px solid #cfd5da;border-radius:8px;background-color:#fff;
background-image:linear-gradient(#d9e1e8 1px,transparent 1px),linear-gradient(90deg,#d9e1e8 1px,transparent 1px);
background-size:20px 20px;touch-action:none}
@media (min-width:800px){canvas{height:calc(100vh - 120px)}}
</style>
</head>
<body>
<header><strong>✏️ TechPilot – Skizze</strong><span>Testversion</span></header>
<div class="toolbar">
<button class="active" onclick="setColor('#111',3,this)">⬛ Schwarz</button>
<button onclick="setColor('#d22',3,this)">🟥 Rot</button>
<button onclick="setColor('#1677d2',3,this)">🟦 Blau</button>
<button onclick="setColor('#198754',3,this)">🟩 Grün</button>
<button onclick="erase(this)">🧽 Radierer</button>
<button onclick="undo()">↩️ Rückgängig</button>
<button onclick="clearCanvas()">🗑️ Löschen</button>
<button class="done" onclick="alert('Skizze-Test beendet 👍🏻')">✓ Fertig</button>
</div>
<canvas id="canvas"></canvas>
<script>
const c=document.getElementById('canvas'),ctx=c.getContext('2d');
let color='#111',size=3,drawing=false,lastX=0,lastY=0,history=[];
function resize(){
 const old=document.createElement('canvas'); old.width=c.width;old.height=c.height;
 if(c.width&&c.height) old.getContext('2d').drawImage(c,0,0);
 c.width=Math.max(300,window.innerWidth-20);c.height=Math.max(300,window.innerHeight-125);
 if(old.width&&old.height)ctx.drawImage(old,0,0);
}
resize();window.addEventListener('resize',resize);
function point(e){const r=c.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top]}
c.addEventListener('pointerdown',e=>{e.preventDefault();drawing=true;[lastX,lastY]=point(e);history.push(ctx.getImageData(0,0,c.width,c.height));c.setPointerCapture(e.pointerId)});
c.addEventListener('pointermove',e=>{if(!drawing)return;e.preventDefault();let [x,y]=point(e);ctx.strokeStyle=color;ctx.lineWidth=size;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(lastX,lastY);ctx.lineTo(x,y);ctx.stroke();lastX=x;lastY=y});
c.addEventListener('pointerup',()=>drawing=false);c.addEventListener('pointercancel',()=>drawing=false);
function setColor(c1,s,btn){color=c1;size=s;document.querySelectorAll('.toolbar button').forEach(b=>b.classList.remove('active'));btn.classList.add('active')}
function erase(btn){color='#fff';size=20;document.querySelectorAll('.toolbar button').forEach(b=>b.classList.remove('active'));btn.classList.add('active')}
function undo(){if(history.length)ctx.putImageData(history.pop(),0,0)}
function clearCanvas(){ctx.clearRect(0,0,c.width,c.height);history=[]}
</script>
</body>
</html>
